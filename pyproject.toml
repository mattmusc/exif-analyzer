[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exif-analyzer"
version = "0.1.0"
description = "EXIF metadata analyzer and statistics tool"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Matteo Muscella" }
]

dependencies = [
  "pyexiftool"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
exif-analyzer = "exif_analyzer.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["exif_analyzer"]
omit = [
  "exif_analyzer/main.py",
  "exif_analyzer/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
